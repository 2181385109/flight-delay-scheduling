# =====================================================================
# Global configuration for the flight-delay-scheduling system.
# Every module reads from this file; no magic numbers are hard-coded.
# =====================================================================

# Global random seed. All stochastic processes read this value.
seed: 42

# Project paths. `root: null` => auto-detect the repository root.
# All other paths are resolved relative to `root`.
paths:
  root: null
  data_raw: data/raw
  data_processed: data/processed
  outputs: outputs
  figures: outputs/figures
  models: outputs/models
  reports: outputs/reports

# ---------------------------------------------------------------------
# Data source: REAL flights (nycflights13 = 2013 EWR/JFK/LGA departures
# from the US DOT/BTS on-time database + real hourly airport weather).
# ---------------------------------------------------------------------
data:
  source: nycflights13
  year: 2013
  months: [1, 2, 3]             # Q1 2013 (~80k flights); add months for more

  # Prediction horizon: network-state features may only use information
  # observable this many minutes BEFORE scheduled departure. This is the
  # single most important anti-leakage knob for the real-time features.
  prediction_horizon_min: 60
  network_window_min: 180       # look-back window for network-state features

  # Not present in the source data; an operational default is assumed.
  default_min_turnaround: 30
  # Wind above this (mph) is a known sensor error in nycflights13 (max 1048).
  wind_max_mph_valid: 100.0

  # Ranges used to normalize the weather-severity composite (after unit
  # conversion: visibility -> km, wind -> knots, precipitation -> mm/h).
  weather:
    vis_min: 0.5
    vis_max: 12.0
    wind_max: 45.0
    precip_max: 12.0

  # Weights for the weather-severity composite (normalized internally to sum 1).
  weather_severity_weights:
    low_vis: 0.35
    wind: 0.25
    precip: 0.25
    thunder: 0.15

# ---------------------------------------------------------------------
# Feature engineering.
# ---------------------------------------------------------------------
features:
  congestion_window_min: 30     # +/- window (minutes) for airport congestion
  peak_windows:                 # [start_hour, end_hour) treated as peak
    - [7, 10]
    - [17, 20]
  holidays:                     # real US federal holidays in the data year
    - "2013-01-01"              # New Year's Day
    - "2013-01-21"              # MLK Day
    - "2013-02-18"              # Presidents' Day
    - "2013-05-27"              # Memorial Day
    - "2013-07-04"              # Independence Day
    - "2013-09-02"              # Labor Day
    - "2013-10-14"              # Columbus Day
    - "2013-11-11"              # Veterans Day
    - "2013-11-28"              # Thanksgiving
    - "2013-11-29"              # day after Thanksgiving
    - "2013-12-24"              # Christmas Eve
    - "2013-12-25"              # Christmas
    - "2013-12-31"              # New Year's Eve
  time_buckets:                 # hour -> coarse bucket label boundaries
    early: [5, 7]
    morning_peak: [7, 10]
    midday: [10, 17]
    evening_peak: [17, 20]
    night: [20, 24]

# ---------------------------------------------------------------------
# Prediction (LightGBM double-head + baselines + Optuna).
# ---------------------------------------------------------------------
predict:
  test_size: 0.20               # trailing fraction for the time-series split
  group_kfold_splits: 3         # GroupKFold on tail_id (folds over ~80k flights)
  optuna_trials: 15             # HPO trials; raise for a longer, better search
  optuna_timeout_s: 600
  early_stopping_rounds: 50
  rf_n_estimators: 150          # RandomForest baseline trees
  # A dispatcher-style naive rule, kept deliberately reasonable (not a strawman):
  # "expect delay if the weather is poor OR the aircraft's previous leg was late".
  rule_baseline:
    weather_severity_threshold: 0.35
    prev_leg_delay_threshold: 15.0
  # LightGBM Optuna search space.
  search_space:
    num_leaves: [15, 127]
    max_depth: [3, 12]
    learning_rate: [0.01, 0.2]         # log-uniform
    n_estimators: [200, 900]
    min_child_samples: [5, 60]
    subsample: [0.6, 1.0]
    colsample_bytree: [0.6, 1.0]
    reg_alpha: [1.0e-8, 5.0]           # log-uniform
    reg_lambda: [1.0e-8, 5.0]          # log-uniform

# ---------------------------------------------------------------------
# Risk grading (quantile 5-level).
# ---------------------------------------------------------------------
risk:
  source: delay                 # "delay" (predicted minutes) or "proba"
  quantiles: [0.2, 0.4, 0.6, 0.8]
  n_levels: 5
  high_risk_levels: [4, 5]      # L4 / L5 are high risk

# ---------------------------------------------------------------------
# Scheduling optimization (CP-SAT + greedy baseline).
# ---------------------------------------------------------------------
schedule:
  slot_minutes: 5               # offset discretization
  max_offset_min: 30            # K: |offset| <= K
  window_minutes: 15            # capacity accounting window
  runway_capacity: 5            # C: max departures per airport per window
  curfew_hours: [0, 5]          # [start, end) no departures allowed
  weight_high_risk: 5.0         # objective weight for high-risk flights
  weight_normal: 1.0            # objective weight for normal flights
  capacity_penalty: 8.0         # soft-constraint penalty per excess departure
  only_high_risk: false         # optimize all flights (CP-SAT balances capacity globally)
  solver_time_limit_s: 25
  greedy_max_passes: 6
  # Re-timing a schedule is a single-day problem: capacity windows, curfew and
  # turnaround all live within one operating day. null = busiest day loaded.
  day: null

# ---------------------------------------------------------------------
# Metric targets (for reporting / pass-fail annotation only).
# ---------------------------------------------------------------------
metrics:
  high_risk_recall_target: 0.80
  constraint_satisfaction_target: 0.85
  delay_reduction_target: 1.0
